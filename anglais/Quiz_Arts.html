const S={};for(const k in D)S[k]=D[k].split("\n").map(l=>{const i=l.indexOf("=");const p=[l.slice(0,i),l.slice(i+1)];p.cat=k;return p});
const ALL=Object.values(S).flat();
const $=document.getElementById("app");
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let Q,i,score,miss,sel=new Set(Object.keys(S)),dir="mix",n="20",md="qcm";
function home(){
$.innerHTML=`<h1>🎨 Arts</h1><p class="s">${ALL.length} mots et expressions · unité 43</p>
<div class="card"><b>Thèmes</b>${Object.keys(S).map(k=>`<label><input type="checkbox" data-k="${k}" ${sel.has(k)?"checked":""}> ${k} (${S[k].length})</label>`).join("")}</div>
<div class="card"><label>Sens : <select id="d"><option value="mix">Mixte</option><option value="ef">Anglais → Français</option><option value="fe">Français → Anglais</option></select></label>
<label>Mode : <select id="mo"><option value="qcm">Choix multiples</option><option value="type">Saisie (je tape la réponse)</option></select></label>
<label>Questions : <select id="nn"><option>10</option><option>20</option><option>50</option><option value="all">Toutes</option></select></label></div>
<button class="go" id="st">Commencer</button>`;
$.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>c.checked?sel.add(c.dataset.k):sel.delete(c.dataset.k));
d.value=dir;nn.value=n;
mo.value=md;mo.onchange=()=>md=mo.value;d.onchange=()=>dir=d.value;nn.onchange=()=>n=nn.value;
st.onclick=()=>{const p=[...sel].flatMap(k=>S[k]);if(!p.length)return;start(p)}}
function start(p){let a=sh(p);if(n!=="all")a=a.slice(0,+n);Q=a;i=0;score=0;miss=[];ask()}
function ask(){
if(i>=Q.length)return end();
const it=Q[i],ef=dir==="ef"||(dir==="mix"&&Math.random()<.5),qi=ef?0:1,ai=1-qi;
if(md==="type"){
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe").replace(/’/g,"'").trim();
const cl=s=>nz(s).replace(/\(.*?\)/g,"").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
const ns=s=>cl(s).replace(/^(?:(?:un|une|le|la|les|des|a|an|the|to)\s+|l')/,"");
const good=(u,a)=>{const x=ns(u);return x&&(cl(a)===cl(u)||a.split(/,\s*/).some(p=>ns(p)===x))};
$.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="m">${i+1} / ${Q.length} · score ${score}</p>
<div class="q">${it[qi]}</div><input id="ip" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ef?"En français…":"In English…"}"><button class="go" id="vb">Valider</button><div id="nx"></div>`;
ip.focus();let done=0;
const next=()=>{i++;ask()};
const chk=()=>{if(done){next();return}
done=1;const r=good(ip.value,it[ai]);ip.disabled=true;
if(r){score++;ip.classList.add("ok");nx.innerHTML="<p><b>✅ Correct !</b> "+it[ai]+"</p>"}
else{miss.push(it);ip.classList.add("ko");nx.innerHTML=`<p><b>❌ Faux.</b> Réponse : <b>${it[ai]}</b></p><button class="opt" id="ov">J'avais juste (synonyme)</button>`;
ov.onclick=()=>{score++;miss.pop();ip.className="ok";nx.innerHTML="<p><b>✅ Compté juste.</b> "+it[ai]+"</p>"}}
vb.textContent=i+1>=Q.length?"Voir le résultat":"Suivant"};
vb.onclick=chk;ip.onkeydown=e=>{if(e.key==="Enter")chk()};
return}
const cat=it.cat,pool=cat?S[cat]:ALL;
let badPool=sh(pool.filter(x=>x[ai]!==it[ai]));
if(badPool.length<3){const extra=sh(ALL.filter(x=>x[ai]!==it[ai]&&!badPool.includes(x)));badPool=badPool.concat(extra)}
const bad=badPool.slice(0,3).map(x=>x[ai]);
const opts=sh([it[ai],...bad]);
$.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="m">${i+1} / ${Q.length} · score ${score}</p>
<div class="q">${it[qi]}</div>${opts.map(o=>`<button class="opt">${o}</button>`).join("")}<div id="nx"></div>`;
let done=0;
$.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=1;
const right=b.textContent===it[ai];
if(right)score++;else miss.push(it);
$.querySelectorAll(".opt").forEach(x=>{if(x.textContent===it[ai])x.classList.add("ok");else if(x===b)x.classList.add("ko")});
nx.innerHTML=`<button class="go">${i+1>=Q.length?"Voir le résultat":"Suivant"}</button>`;
nx.firstChild.onclick=()=>{i++;ask()}})}
function end(){
$.innerHTML=`<h1>Résultat : ${score} / ${Q.length}</h1>
${miss.length?`<div class="card"><b>À revoir</b>${miss.map(m=>`<p>${m[0]} → <b>${m[1]}</b></p>`).join("")}</div><button class="go" id="r">Refaire les erreurs</button>`:`<p>Parfait ! 🎉</p>`}
<button class="opt" id="h">Retour au menu</button>`;
h.onclick=home;if(window.r)r.onclick=()=>{Q=sh(miss);i=0;score=0;miss=[];ask()}}
home();
</script></body></html>
