<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche de vocabulaire – Commentaire de texte (FR → EN britannique)</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#222;--mute:#6b6b6b;--acc:#8a2b2b;--line:#e4ddd0;--chip:#f1ebe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#201f24;--ink:#ece8e1;--mute:#a09c94;--acc:#e08a7a;--line:#34323a;--chip:#2a2830}}
:root[data-theme="dark"]{--bg:#17161a;--card:#201f24;--ink:#ece8e1;--mute:#a09c94;--acc:#e08a7a;--line:#34323a;--chip:#2a2830}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
header{padding:28px 18px 8px;max-width:960px;margin:auto}
h1{margin:0 0 4px;font-size:1.7rem;color:var(--acc)}
header p{margin:0;color:var(--mute);font-family:system-ui,sans-serif;font-size:.92rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 18px;max-width:960px;margin:auto;font-family:system-ui,sans-serif}
.bar input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1rem}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.nav a{white-space:nowrap;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none}
main{max-width:960px;margin:auto;padding:6px 18px 40px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:16px 0;padding:6px 16px 12px}
h2{font-size:1.15rem;color:var(--acc);margin:12px 0 2px}
.sub{font-family:system-ui,sans-serif;font-size:.82rem;color:var(--mute);margin:0 0 8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);border-top:0}
td:first-child{width:36%}
td.en{font-weight:600}
td em{color:var(--mute);font-size:.88rem}
.hide{display:none}
.tip{background:var(--chip);border-radius:8px;padding:10px 12px;font-family:system-ui,sans-serif;font-size:.88rem;margin:8px 0}
@media print{.bar{display:none}section{break-inside:avoid;border:0}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header>
<h1>Vocabulaire du commentaire de texte</h1>
<p>🇬🇧 Français → anglais britannique · figures de style, verbes d'analyse, connecteurs, orthographe et lexique UK</p>
</header>
<div class="bar">
<input id="q" type="search" placeholder="Rechercher (ex. métaphore, to convey, ironie…)" aria-label="Rechercher">
<div class="nav" id="nav"></div>
</div>
<main id="app"></main>

]],

const app=document.getElementById('app'),nav=document.getElementById('nav');
S.forEach(([t,sub,rows],i)=>{
const id='s'+i,sec=document.createElement('section');sec.id=id;

const a=document.createElement('a');a.href='#'+id;a.textContent=t.split(' ')[0]+(t.split(' ')[1]&&t.split(' ')[0].length<5?' '+t.split(' ')[1]:'');nav.appendChild(a);

const tip=document.createElement('div');tip.className='tip';
tip.innerHTML='<b>Rappel méthode :</b> citer → identifier le procédé → expliquer l\'effet → relier à l\'idée directrice. Ex. : <i>The repetition of ‘dark’ (l. 4) evokes a sense of dread and reinforces the oppressive atmosphere.</i>';
app.insertBefore(tip,app.firstChild);
document.getElementById('q').addEventListener('input',e=>{
const v=e.target.value.toLowerCase().trim();
document.querySelectorAll('section').forEach(s=>{
let any=false;
s.querySelectorAll('tbody tr').forEach(r=>{const m=!v||r.textContent.toLowerCase().includes(v);r.classList.toggle('hide',!m);if(m)any=true});
s.classList.toggle('hide',!any);
});
});
</script>
</body>
</html>
