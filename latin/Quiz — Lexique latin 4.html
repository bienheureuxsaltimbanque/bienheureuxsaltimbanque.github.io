<html lang="fr"><head><meta charset="utf-8">

<style>

<script>
// cat|étoile|mot|formes (; = séparateur, / = variante acceptée)|sens (¶ = précision)
const CL={N:"Noms",A:"Adjectifs",V:"Verbes",I:"Invariables",E:"Expressions",S:"Sum et composés",Q:"Compléments de lieu"};
const LEX=4;
const T3=`N|*|Italia|ae;f|l'Italie
N|*|fama|ae;f|rumeur, renommée, réputation, tradition orale
N||terra|ae;f|terre, pays
N||natura|ae;f|nature
N||fortuna|ae;f|fortune, chance, malheur
N||injuria|ae;f|injustice, tort, illégalité, injure
N|*|poena|ae;f|compensation, rançon, amende, expiation, punition, châtiment, chagrin, peine
N||populus|i;m|peuple
N|*|filius|ii;m|fils
N|*|signum|i;n|signe, signal, enseigne, statue
N|*|exemplum|i;n|modèle, exemple ¶ fondement de la transmission par l'imitation chez les Romains
N|*|monumentum|i;n|monument, souvenir ¶ ce qui fixe la mémoire pour la transmettre
N||arma|orum;n pl/n|armes (neutre pluriel)
N|*|beneficium|ii;n|bienfait
N|*|vitium|ii;n|défaut, faute, vice
A|*|antiquus|antiqua;antiquum|ancien, antique
A|*|peritus|perita;peritum|habile, expérimenté, qui connaît (+ génitif)
A|*|fidus|fida;fidum|fiable, fidèle, sûr
A|*|clarus|clara;clarum|clair, illustre
A||miser|misera;miserum|malheureux, qui rend malheureux, excessif
A||malus|mala;malum|mauvais, méchant
A||altus|alta;altum|haut, profond
A||alienus|aliena;alienum|étranger, qui appartient à un autre
A||alius|alia;aliud|autre ¶ alius… alius : l'un… un autre ; alii… alii : les uns… les autres. Répétés à des cas différents dans la même proposition : (a) réciprocité, alii alio diligite : aimez-vous les uns les autres ; (b) diversité, alii alia putant : les uns pensent une chose, les autres une autre (opinions différentes)
A||noster|nostra;nostrum|notre, nôtre
A||vester|vestra;vestrum|votre, vôtre, vos
V|*|scribo|scribis;scribere;scripsi;scriptum|tracer, composer, écrire
V|*|colo|colis;colere;colui;cultum|cultiver, habiter, protéger, chérir, honorer, respecter, entourer d'égards
V|*|trado|tradis;tradere;tradidi;traditum|transmettre, livrer, enseigner
V|*|cognosco|cognoscis;cognoscere;cognovi;cognitum|apprendre à connaître, étudier, chercher à savoir
V|*|memini|meministi;meminisse|se souvenir, faire mention de ¶ verbe défectif
V||jubeo|jubes;jubere;jussi;jussum|ordonner, décider, autoriser, inviter à
V|*|accipio|accipis;accipere;accepi;acceptum|recevoir
V||mitto|mittis;mittere;misi;missum|laisser partir, relâcher, cesser de, envoyer, émettre
V|*|quaero|quaeris;quaerere;quaesivi/quaesii;quaesitum|rechercher, enquêter, chercher à, demander
V||debeo|debes;debere;debui;debitum|devoir, être redevable de, tenir de quelqu'un
I||prope||adv. presque ¶ prép. + acc. : près de
I||ne||pour que ne pas, de peur que, pour éviter que
I||nam||en vérité, à ce propos, car
I||sic||ainsi
I||tam||autant
I||quidem||certes, assurément, en vérité, mais du moins
I||ergo||donc, ainsi donc, par conséquent ¶ prép. postposée + génitif : à cause de
I||autem||mais, tandis que ¶ légère opposition : mais, tandis que ; balancement : d'autre part, quant à, du moins ; reprise d'un mot ou d'une idée : or ; addition : et puis, mais aussi, mais en outre
I||nisi||si ne pas, à moins que, excepté
I||at||d'autre part, quant à, du moins
I||et||(adv.) aussi, même
I||itaque||et ainsi, c'est pourquoi, aussi
I||bene||bien
I||tum||alors
I||apud||[+ acc.] auprès de, chez
I||sub||[+ abl.] sous, au pied de
E||memoriae tradere||transmettre à la postérité, rapporter pour l'Histoire
E||do poenas temeritatis meae||je suis puni de (pour) mon imprudence`;const PR=(t,L)=>t.split("\n").map(l=>{const[c,s,w,f,m]=l.split("|");let F=f?f.split(";"):[];if(c=="N"){const e=F[0],st=e=="ii"?w.slice(0,-3):w.slice(0,-(w.endsWith("a")?1:2));F[0]=e+"|"+st+e}if(c=="A"&&w.endsWith("us")&&w!="alius")F=[F[0]+"|a",F[1]+"|um"];if(c=="V"&&w.endsWith("o")){const t=w.slice(0,-1);F=F.map(x=>x.startsWith(t)&&!x.includes("/")&&x.length-t.length>1?x+"|"+x.slice(t.length):x)}return{c,s:!!s,w,f:F,m,L}});
const T4=`N|*|scientia|ae;f|connaissance, savoir, science
N|*|litterae|arum;f pl/f|(pl.) les lettres, la littérature, la culture
N||grammatica|ae;f|la grammaire
N|*|historia|ae;f|l'histoire
N|*|geographia|ae;f|la géographie
N|*|modus|i;m|mesure, mode, modération, limite, manière, façon
N|*|cura|ae;f|soin, souci, administration, traitement
N||ira|ae;f|colère
N||oculus|i;m|œil
N||annus|i;m|année
N||amicus|i;m|ami
N|*|responsum|i;n|réponse
N|*|erratum|i;n|faute
N|*|calculus|i;m|pion, jeton
N|*|ingenium|ii;n|disposition naturelle, génie, talent / caractère, tempérament, naturel, psychologie, nature, personnalité
N|*|consilium|ii;n|I. assemblée, décision, projet, dessein ; II. conseil, avis
N||imperium|ii;n|commandement, ordre, autorité, empire, pouvoir
N||regnum|i;n|autorité royale, empire, règne, royaume
N||periculum|i;n|essai, épreuve, risque, danger, péril
A|*|dubius|dubia;dubium|douteux, incertain
A|*|certus|certa;certum|certain, sûr, décidé, fixé
A|*|rectus|recta;rectum|correct, juste, droit, honnête
V|*|respondeo|respondes;respondere;respondi;responsum|répondre
V|*|castigo|castigas;castigare;castigavi;castigatum|corriger, réprimander
V|*|verbero|verberas;verberare;verberavi;verberatum|fouetter
V|*|erro|erras;errare;erravi;erratum|se tromper, errer
V|*|credo|credis;credere;credidi;creditum|I. prêter, croire ; II. se fier à [+ datif]
V|*|scio|scis;scire;scivi;scitum|savoir, être au courant
V|*|puto|putas;putare;putavi;putatum|mettre au net, émonder, épurer, calculer, estimer, penser, juger
V|*|duco|ducis;ducere;duxi;ductum|conduire, juger, estimer
V||vinco|vincis;vincere;vici;victum|vaincre
V||pono|ponis;ponere;posui;positum|mettre à l'écart, abandonner, poser, placer
V||eo|is;ire;ivi/ii;itum|aller ¶ irrégulier : indicatif présent eo, is, it, imus, itis, eunt ; imparfait ibam ; futur ibo ; subjonctif présent eam
V||capio|capis;capere;cepi;captum|prendre, concevoir
V||teneo|tenes;tenere;tenui;tentum|tenir, occuper, arrêter, comprendre, durer, persister
V||vivo|vivis;vivere;vixi;victum|vivre
V||relinquo|relinquis;relinquere;reliqui;relictum|laisser en arrière, abandonner
V||voco|vocas;vocare;vocavi;vocatum|invoquer, appeler, provoquer, citer en justice
V||timeo|times;timere;timui|craindre
V||sum|es;esse;fui|être
V|*|adsum|ades;adesse;adfui|être présent ¶ préverbe invariable ad + sum
V||absum|abes;abesse;afui|être absent ¶ de ab, loin de
V||desum|dees;deesse;defui|manquer ¶ de de, privatif : nihil mihi deest (rien ne me manque)
V||intersum|interes;interesse;interfui|assister à ¶ de inter, parmi
V||praesum|praees;praeesse;praefui|être à la tête de ¶ de prae, devant
V||supersum|superes;superesse;superfui|survivre ¶ de super, sur
V||possum|potes;posse;potui|pouvoir ¶ à l'origine : pote est, il est possible
V||prosum|prodes;prodesse;profui|être utile ¶ à l'origine : de pro, pour, anciennement prod ; prōd-sum > prō-sum (assimilation et simplification de -ss- après voyelle longue)
I||deinde||ensuite, puis
I||dum||aussi longtemps que, jusqu'à ce que, pendant que, pourvu que
I||saepe||souvent
I||modo||justement, dans cette mesure, seulement, à l'instant
I||simul||en même temps
I||parum||peu, trop peu
I||semper||toujours
I||tantum||tant, autant ; tellement, seulement ¶ [+ subst. au gén. … ut] : tel… que, assez de… pour ; tantum animi ut : « assez de courage pour… »
I||vel||si tu veux, ou bien, même, peut-être
I||haud||ne pas, vraiment pas
I||contra||adv. en face, au contraire ¶ prép. + acc. : en face de, contre
I||post||[+ acc.] après, depuis, derrière
I||inter||[+ acc.] entre, parmi
I||propter||[+ acc.] à côté de
I||licet||il est permis
E|*|docere aliquem litteras||apprendre à lire à qqn
Q||ubi ? — lieu ordinaire||in + ablatif ¶ ex. in horto
Q||ubi ? — noms de ville||locatif (quand il existe), sinon ablatif seul ¶ ex. sum Lugduni ; natus est Athenis
Q||ubi ? — proximité||apud + acc. ou ad + acc.
Q||quo ? — lieu ordinaire||in + acc. ¶ ex. in hortum
Q||quo ? — noms de ville||acc. seul ¶ ex. eo Lutetiam
Q||quo ? — proximité||ad + acc.
Q||unde ? — lieu ordinaire||ex + abl. ¶ ex. ex urbe
Q||unde ? — noms de ville||abl. seul ¶ ex. redeo Roma
Q||unde ? — proximité||ab + abl.
Q||qua ? — cas général||per + acc. ¶ ex. iter feci per Galliam
Q||qua ? — routes et portes||abl. seul ¶ ex. ibam Via Sacra`;
const D=[...PR(T3,3),...PR(T4,4)].filter(x=>x.L==LEX);
[["sum","","","fui","esse","être"],["adsum","ad","ad","adfui","adesse","être présent"],["possum","pot","pos","potui","posse","pouvoir"],["prosum","prod","pro","profui","prodesse","être utile"]].forEach(([v,a,b,pf,inf,m])=>{const k=(t,f)=>LEX==4&&D.push({c:"S",s:false,w:v+" — "+t,f,m:m+" : "+t,L:4});
k("indicatif présent",["sum","es","est","sumus","estis","sunt"].map(x=>(x[0]=="s"?b:a)+x));
k("indicatif imparfait",["eram","eras","erat","eramus","eratis","erant"].map(x=>a+x));
k("indicatif futur",["ero","eris","erit","erimus","eritis","erunt"].map(x=>a+x));
k("parfait et infinitif",[pf,inf])});

const $=s=>document.querySelector(s),app=$("#app");
const short=w=>w.m.split("¶")[0].trim(),more=w=>w.m.includes("¶")?w.m.split("¶")[1].trim():"";
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/æ/g,"ae").replace(/œ/g,"oe").replace(/j/g,"i").replace(/v/g,"u").replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
const good=(v,e)=>e.split(/[\/|]/).some(x=>norm(x)==norm(v));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const labs=w=>w.c=="S"?(w.f.length==6?["1re sg","2e sg","3e sg","1re pl","2e pl","3e pl"]:["parfait","infinitif"]):w.c=="N"?["génitif","genre (m / f / n)"]:w.c=="A"?["féminin","neutre"]:w.f.length==2?["2e pers. sg du parfait","infinitif"]:w.f.length==3?["2e pers. sg","infinitif","parfait"]:["2e pers. sg","infinitif","parfait","supin"];
const full=w=>{const a=x=>x.split("|")[0].split("/");return w.c=="S"?w.w+" : "+w.f.join(", "):w.c=="N"?`${w.w}, ${a(w.f[0])[0]}, ${a(w.f[1])[0].replace(" pl",". pl")}.`.replace("..","."):[w.w,...w.f.map(x=>w.c=="A"?a(x)[0]:a(x).join(" ou "))].join(", ")};
let cfg={mode:"sens",cat:"all",star:false,lex:LEX},S;

const pool=()=>D.filter(w=>(cfg.cat=="all"||w.c==cfg.cat)&&(!cfg.star||w.s)&&(cfg.lex=="all"||w.L==cfg.lex)&&(w.c!="S"||cfg.mode=="formes")&&(w.c!="Q"||cfg.mode=="sens")&&(cfg.mode!="formes"||w.f.length));

function home(){
 const M=[["sens","Sens","Latin → français (QCM)"],["formes","Formes","Latin → toutes les formes"],["latin","Version inverse","Français → latin + formes"]];
 const C=[["all","Tout"],...Object.entries(CL).filter(([k])=>D.some(x=>x.c==k))];
 app.innerHTML=`<h1>Lexique latin ${LEX}</h1><p class="sub">Connaître &amp; transmettre · ${D.length} mots</p>
 <h2>Exercice</h2><div class="chips">${M.map(m=>`<button class="chip ${cfg.mode==m[0]?"on":""}" data-m="${m[0]}">${m[1]}<small>${m[2]}</small></button>`).join("")}</div>
 <h2>Catégorie</h2><div class="chips">${C.map(c=>`<button class="chip ${cfg.cat==c[0]?"on":""}" data-c="${c[0]}">${c[1]}</button>`).join("")}</div>
 <h2>Filtre</h2><div class="chips"><button class="chip ${cfg.star?"on":""}" data-s="1">Seulement les mots * (${D.filter(w=>w.s).length})</button></div>
 <p class="note">${pool().length} mot(s) dans cette sélection. Les macrons, j/i, u/v et æ/ae sont tolérés ; pour les noms et adjectifs, la terminaison seule (« ae », « a ») ou la forme complète est acceptée.</p>
 <button class="btn" id="go">Commencer</button><button class="btn alt" id="fiche">Fiche de révision</button><button class="btn alt" id="clas">Classement par désinences</button>`;
 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;home()});
 app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cfg.cat=b.dataset.c;home()});
 app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{cfg.star=!cfg.star;home()});
 app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{cfg.lex=b.dataset.l=="all"?"all":+b.dataset.l;home()});$("#go").onclick=()=>start(pool());$("#fiche").onclick=fiche;$("#clas").onclick=classement;
}
function fiche(){
 app.innerHTML=`<button class="btn alt" id="back" style="margin-top:0">← Retour</button><h1>Fiche de révision</h1>`+
 Object.entries(CL).filter(([k])=>D.some(x=>x.c==k)).map(([k,n])=>`<h2>${n}</h2>`+D.filter(w=>w.c==k).map(w=>`<div class="row"><b>${w.s?"* ":""}${full(w)}</b><br>${short(w)}${more(w)?`<div class="note">${more(w)}</div>`:""}</div>`).join("")).join("");
 $("#back").onclick=home;
}

const VC=[
["1re conjugaison · -o, -as, -are, -avi, -atum",["castigo","verbero","erro","puto","voco"]],
["2e conjugaison · -eo, -es, -ere, -ui, -itum",["debeo"]],
["2e conjugaison · -eo, -es, -ere, -ui, -tum",["teneo"]],
["2e conjugaison · -eo, -es, -ere, -ui (sans supin)",["timeo"]],
["2e conjugaison · -eo, -es, -ere, parfait en -i / -ssi, supin en -sum / -ssum",["respondeo","jubeo"]],
["3e conjugaison · -o, -is, -ere · parfait en -si / -xi",["scribo","mitto","duco","vivo"]],
["3e conjugaison · -o, -is, -ere · parfait en -ui",["colo","pono"]],
["3e conjugaison · -o, -is, -ere · parfait à redoublement (-didi)",["trado","credo"]],
["3e conjugaison · -o, -is, -ere · parfait en -vi",["cognosco","quaero"]],
["3e conjugaison · -o, -is, -ere · autres parfaits",["vinco","relinquo"]],
["3e conjugaison mixte · -io, -is, -ere",["accipio","capio"]],
["4e conjugaison · -io, -is, -ire, -ivi, -itum",["scio"]],
["Irréguliers · sum et composés (-es, -esse, -fui)",["sum","adsum","absum","desum","intersum","praesum","supersum"]],
["Irréguliers · autres",["possum","prosum","eo","memini"]]];
const PP=[["prope","acc",3,"près de"],["apud","acc",3,"auprès de, chez"],["contra","acc",4,"en face de, contre"],["post","acc",4,"après, depuis, derrière"],["inter","acc",4,"entre, parmi"],["propter","acc",4,"à côté de"],["ad","acc",4,"tableau des compléments de lieu"],["per","acc",4,"tableau des compléments de lieu"],["in","acc/abl",4,"tableau des compléments de lieu : + abl. (ubi ?) ou + acc. (quo ?)"],["sub","abl",3,"sous, au pied de"],["ex","abl",4,"tableau des compléments de lieu"],["ab","abl",4,"tableau des compléments de lieu"],["ergo","gen",3,"à cause de (postposée)"]];
function classement(){
 const row=w=>`<div class="row"><b>${full(w)}</b> <span class="note">${short(w)}</span></div>`;
 const grp=(t,l)=>l.length?`<h3>${t}</h3>`+l.join(""):"";
 let h=`<button class="btn alt" id="back" style="margin-top:0">← Retour</button><h1>Classement par désinences</h1><h2>Verbes</h2>`;
 VC.forEach(([t,ws])=>{h+=grp(t,ws.map(n=>D.find(x=>x.w==n&&x.c=="V")).filter(Boolean).map(row))});
 h+=`<h2>Noms</h2>`;const g={};
 D.filter(x=>x.c=="N").forEach(w=>{const e=w.f[0].split("|")[0],gd=w.f[1].split("/")[0][0],nom=["ae","ius","ium","us","um"].find(s=>w.w.endsWith(s))||"a",k=gd+nom+e;
  (g[k]=g[k]||{gd,l:[],t:`${{m:"Masculins",f:"Féminins",n:"Neutres"}[gd]} · ${["ae","arum"].includes(e)?"1re":"2e"} déclinaison · -${nom}, -${e}`}).l.push(row(w))});
 ["m","f","n"].forEach(gd=>Object.values(g).filter(x=>x.gd==gd).forEach(x=>h+=grp(x.t,x.l)));
 h+=`<h2>Prépositions</h2>`;
 [["acc","Avec l'accusatif"],["abl","Avec l'ablatif"],["acc/abl","Avec l'accusatif ou l'ablatif"],["gen","Avec le génitif"]].forEach(([c,t])=>{
  const cs={acc:"+ acc.",abl:"+ abl.","acc/abl":"+ acc. / + abl.",gen:"+ gén."};
  h+=grp(t,PP.filter(p=>p[1]==c&&p[2]==LEX).map(p=>`<div class="row"><b>${p[0]} ${cs[c]}</b> <span class="note">${p[3]}</span></div>`))});
 app.innerHTML=h;$("#back").onclick=home;
}
function start(list){
 if(!list.length){alert("Aucun mot dans cette sélection (Formes : ni invariables ni expressions ; Sum : mode Formes ; Compléments de lieu : mode Sens).");return}
 S={q:shuf(list),i:0,ok:0,bad:[]};ask();
}
function head(){const w=S.q[S.i];return `<div class="top"><span>${S.i+1} / ${S.q.length}</span><span>${S.ok} juste(s)</span></div><div class="bar"><i style="width:${S.i/S.q.length*100}%"></i></div>`}
function ask(){
 if(S.i>=S.q.length)return end();
 const w=S.q[S.i];
 if(cfg.mode=="sens"){
  let o=shuf(D.filter(x=>x!==w&&x.c==w.c&&short(x)!=short(w))).slice(0,3);
  if(o.length<3)o=o.concat(shuf(D.filter(x=>x!==w&&!o.includes(x)&&x.c!="S"&&x.c!="Q"&&short(x)!=short(w))).slice(0,3-o.length));
  o=shuf([w,...o]);
  app.innerHTML=head()+`<div class="card"><div class="tag">${CL[w.c]}</div><div class="lat">${w.w}</div>${o.map((x,k)=>`<button class="opt" data-k="${k}">${short(x)}</button>`).join("")}<div id="fb"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const x=o[b.dataset.k],r=x===w;app.querySelectorAll(".opt").forEach((e,k)=>{e.disabled=true;if(o[k]===w)e.classList.add("ok")});
   if(!r)b.classList.add("ko");r?S.ok++:S.bad.push(w);
   $("#fb").innerHTML=`<div class="fb ${r?"ok":"ko"}"><b>${r?"Juste":"Faux"}</b>${full(w)} : ${short(w)}${more(w)?`<div class="note">${more(w)}</div>`:""}</div><button class="btn" id="go">Suivant</button>`;
   $("#go").onclick=()=>{S.i++;ask()};$("#go").focus();
  });return;
 }
 const inv=cfg.mode=="latin",ex=inv?[w.w,...w.f]:w.f,lb=inv?["mot latin",...(w.f.length?labs(w):[])]:labs(w);
 app.innerHTML=head()+`<div class="card"><div class="tag">${CL[w.c]}</div>${inv?`<div class="lat" style="font-size:22px">${short(w)}</div>`:`<div class="lat">${w.w}</div><div class="tag">${short(w)}</div>`}
 ${ex.map((e,k)=>`<div class="f"><label for="i${k}">${lb[k]}</label><input id="i${k}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>`).join("")}
 <div id="fb"></div><button class="btn" id="go">Valider</button></div>`;
 const ins=[...app.querySelectorAll("input")];ins[0].focus();let done=false;
 $("#go").onclick=()=>{
  if(done){S.i++;ask();return}
  done=true;const r=ex.map((e,k)=>good(ins[k].value,e));
  ins.forEach((el,k)=>{el.disabled=true;el.classList.add(r[k]?"ok":"ko")});
  const all=r.every(Boolean);all?S.ok++:S.bad.push(w);
  const wrong=r.map((v,k)=>v?"":`${lb[k]} : <b style="display:inline">${ex[k].split(/[\/|]/).join(" ou ")}</b>`).filter(Boolean);
  $("#fb").innerHTML=`<div class="fb ${all?"ok":"ko"}"><b>${all?"Juste":"À corriger"}</b>${full(w)} : ${short(w)}${all?"":`<div class="note">${wrong.join("<br>")}</div>`}${more(w)?`<div class="note">${more(w)}</div>`:""}</div>`;
  $("#go").textContent="Suivant";$("#go").focus();
 };
 ins.forEach((el,k)=>el.addEventListener("keydown",e=>{if(e.key=="Enter"){e.preventDefault();k<ins.length-1&&!done?ins[k+1].focus():$("#go").click()}}));
}
function end(){
 const n=S.q.length,p=Math.round(S.ok/n*100);
 app.innerHTML=`<h1>Résultat</h1><div class="big">${S.ok} / ${n}</div><p class="sub" style="text-align:center">${p} % de réussite${p==100?" : lexique maîtrisé":""}</p>
 ${S.bad.length?`<h2>À revoir (${S.bad.length})</h2>`+S.bad.map(w=>`<div class="row"><b>${full(w)}</b><br>${short(w)}</div>`).join("")+`<button class="btn" id="re">Refaire les erreurs</button>`:""}
 <button class="btn alt" id="again">Recommencer</button><button class="btn alt" id="menu">Menu</button>`;
 if(S.bad.length)$("#re").onclick=()=>start(S.bad);
 $("#again").onclick=()=>start(pool());$("#menu").onclick=home;
}
home();
</script></body></html>
